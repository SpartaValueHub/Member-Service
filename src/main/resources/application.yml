spring:
  application:
    name: member-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    # instance-id는 EurekaInstancePortCustomizer에서 실제 할당 포트로 설정 (예: member-service:51234)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 이미지 Presigned 업로드 (EC2 Instance Role — Access Key 불필요)
app:
  media:
    s3-bucket: ${S3_BUCKET:}
    cloudfront-base-url: ${CLOUDFRONT_BASE_URL:}
    aws-region: ${AWS_REGION:ap-northeast-2}
    max-bytes: 5242880
    presign-ttl-seconds: 300
    pending-prefix: pending/
    confirmed-prefix: profiles/
    extension-by-content-type:
      "image/jpeg": jpg
      "image/png": png
      "image/webp": webp
      "image/gif": gif
    passthrough-urls:
      - /images/default-profile.png
